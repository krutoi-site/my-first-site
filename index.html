<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Модель Color K1</title>
    <!-- Подключаем файл со стилями -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="chat-box">
        <h1>Модель Color K1</h1>
        
        <!-- Поле ввода (в Python это был input) -->
        <input type="text" id="user-input" placeholder="Введите ваш вопрос..." autocomplete="off">
        
        <!-- Кнопка для отправки -->
        <button id="send-btn">Спросить</button>
        
        <!-- Место, куда мы будем выводить ответ (в Python это был print) -->
        <div id="bot-answer" class="answer"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
